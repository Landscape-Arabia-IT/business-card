<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Employee cards</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800&amp;family=Inter:wght@600;700&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        padding: 28px 20px 40px;
        background:
          radial-gradient(ellipse at 12% 30%, rgba(52, 94, 44, 0.12), transparent 28%),
          radial-gradient(ellipse at 88% 78%, rgba(52, 94, 44, 0.12), transparent 30%),
          linear-gradient(135deg, #f8f8f6, #e9e9e5 48%, #f7f7f5);
        color: #171918;
        font-family: Inter, Arial, sans-serif;
      }

      h1 {
        margin: 0 0 22px;
        text-align: center;
        font-family: Cairo, Arial, sans-serif;
        font-size: 28px;
        font-weight: 800;
      }

      .board {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        align-items: flex-start;
        gap: 28px;
      }

      .slot {
        width: min(100%, 400px);
      }

      .slot h2 {
        margin: 0 0 8px;
        text-align: center;
        color: #08682d;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.08em;
      }

      iframe {
        display: block;
        width: 100%;
        height: 820px;
        border: 0;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <h1>Employee cards</h1>
    <div class="board">
      <section class="slot">
        <h2>PHELADELFIA</h2>
        <iframe
          src="pheladelfia.html?embed=1"
          title="Pheladelfia employee card"
        ></iframe>
      </section>
      <section class="slot">
        <h2>LANDSCAPE ARABIA</h2>
        <iframe
          src="landscape.html?embed=1"
          title="Landscape Arabia employee card"
        ></iframe>
      </section>
    </div>
  </body>
</html>
