<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="بطاقة تعريف موظف شركة PH. Agri" />
    <title>بطاقة موظف | PH. Agri</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&amp;family=Inter:wght@400;600;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        --green: #08682d;
        --green-dark: #034622;
        --green-deep: #00371f;
        --gold: #d3a82c;
        --ink: #171918;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 16px;
        overflow-x: hidden;
        background:
          radial-gradient(
            ellipse at 12% 30%,
            rgba(52, 94, 44, 0.12),
            transparent 28%
          ),
          radial-gradient(
            ellipse at 88% 78%,
            rgba(52, 94, 44, 0.12),
            transparent 30%
          ),
          linear-gradient(135deg, #f8f8f6, #e9e9e5 48%, #f7f7f5);
        color: var(--ink);
        font-family: "Cairo", Arial, sans-serif;
      }

      .display {
        width: min(100%, 360px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .stage {
        width: 100%;
        aspect-ratio: 0.66;
        perspective: 1400px;
        filter: drop-shadow(0 24px 24px rgba(20, 28, 22, 0.18));
      }

      .card {
        position: relative;
        width: 100%;
        height: 100%;
        padding: 0;
        border: 0;
        border-radius: 20px;
        background: transparent;
        color: inherit;
        cursor: pointer;
        transform-style: preserve-3d;
        transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        -webkit-tap-highlight-color: transparent;
      }

      .card.flipped {
        transform: rotateY(180deg);
      }

      .badge {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 20px;
        background: #fff;
        box-shadow: 0 10px 30px rgba(20, 28, 22, 0.16);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        cursor: pointer;
        text-align: start;
      }

      .badge-back {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 20px 24px 18px;
        background: linear-gradient(155deg, #fff 0%, #fbfcfa 68%, #f2f5f1 100%);
        transform: rotateY(180deg);
        text-align: center;
      }

      .back-brand {
        width: 82%;
        height: 112px;
        flex: 0 0 112px;
        object-fit: contain;
      }

      .brand-divider,
      .back-divider {
        width: 52%;
        height: 1px;
        flex: 0 0 1px;
        margin: 2px 0 14px;
        background: linear-gradient(90deg, transparent, #c8a342, transparent);
      }

      .back-title {
        color: var(--green-deep);
        font-size: 17px;
        font-weight: 800;
        line-height: 1.5;
      }

      .back-subtitle {
        margin-top: 3px;
        color: #747d76;
        font-family: Inter, Arial, sans-serif;
        font-size: 9px;
        font-weight: 600;
        letter-spacing: 0.16em;
        direction: ltr;
      }

      .qr-wrap {
        position: relative;
        z-index: 1;
        width: 158px;
        height: 158px;
        display: grid;
        place-items: center;
        margin-top: 20px;
        border: 1px solid #e3e8e2;
        border-radius: 16px;
        background: #fff;
        box-shadow: 0 8px 22px rgba(26, 53, 34, 0.09);
      }

      .company-qr {
        width: 136px;
        height: 136px;
        display: block;
      }

      .scan-label {
        z-index: 1;
        margin-top: 15px;
        color: #294d35;
        font-size: 14px;
        font-weight: 600;
      }

      .scan-hint {
        z-index: 1;
        margin-top: 4px;
        color: #858d87;
        font-family: Inter, Arial, sans-serif;
        font-size: 9px;
        letter-spacing: 0.18em;
        direction: ltr;
      }

      .company-url {
        z-index: 1;
        margin-top: 14px;
        padding: 7px 11px;
        border: 1px solid #e3e8e2;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.75);
        color: #416148;
        font-family: Inter, Arial, sans-serif;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.01em;
        direction: ltr;
      }

      .back-bottom {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        margin-top: auto;
        padding-top: 12px;
        border-top: 1px solid #e2e7e0;
      }

      .back-company {
        color: var(--green-deep);
        font-size: 13px;
        font-weight: 700;
      }

      .back-company-en {
        margin-top: 3px;
        color: #7d857f;
        font-family: Inter, Arial, sans-serif;
        font-size: 8px;
        letter-spacing: 0.12em;
        direction: ltr;
      }

      .flip-control {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 18px;
        border: 1px solid rgba(8, 104, 45, 0.2);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.86);
        color: var(--green-dark);
        font:
          600 13px "Cairo",
          Arial,
          sans-serif;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.2s;
      }

      .flip-control:hover {
        background: #fff;
        transform: translateY(-1px);
      }

      .flip-control svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-width: 1.8;
      }

      .card:focus-visible,
      .flip-control:focus-visible {
        outline: 3px solid var(--gold);
        outline-offset: 4px;
      }

      .insert {
        position: relative;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        overflow: hidden;
        background: linear-gradient(180deg, #fff 0%, #fff 77%, #f8faf7 100%);
        padding: 15px 18px 0;
      }

      .brand {
        width: 100%;
        height: 124px;
        flex: 0 0 124px;
        object-fit: contain;
      }

      .brand-divider {
        margin-bottom: 8px;
      }

      .portrait {
        width: 62%;
        aspect-ratio: 1 / 0.84;
        flex: 0 0 auto;
        display: grid;
        place-items: center;
        overflow: hidden;
        border: 2px solid #16843b;
        border-radius: 14px;
        background: #e7ebe6;
        box-shadow: 0 4px 12px rgba(5, 65, 31, 0.08);
      }

      .portrait img {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        object-position: 68% 20%;
      }

      .portrait svg {
        width: 82%;
        height: 92%;
        align-self: end;
        fill: #989898;
      }

      .employee {
        flex: 0 0 auto;
        margin-top: 10px;
        text-align: center;
        line-height: 1.24;
      }

      .employee-en,
      .job-en,
      .number {
        font-family: Inter, Arial, sans-serif;
        direction: ltr;
      }

      .employee-en {
        color: #171918;
        font-size: clamp(17px, 5.2vw, 21px);
        font-weight: 800;
      }

      .divider {
        width: 68%;
        height: 1px;
        flex: 0 0 1px;
        margin: 10px 0 8px;
        background: linear-gradient(90deg, transparent, #c8a342, transparent);
      }

      .job {
        position: relative;
        z-index: 2;
        flex: 0 0 auto;
        margin-bottom: 2px;
        text-align: center;
        line-height: 1.3;
      }

      .job-en {
        color: #37433a;
        font-size: clamp(15px, 4.3vw, 18px);
        font-weight: 700;
      }

      .footer {
        position: relative;
        z-index: 1;
        width: calc(100% + 36px);
        flex: 0 0 126px;
        margin-top: auto;
        margin-inline: -18px;
        color: #fff;
      }

      .footer-wave {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 100%;
        height: 176px;
        display: block;
        z-index: 0;
        pointer-events: none;
      }

      .footer-leaf {
        position: absolute;
        z-index: 1;
        right: 14px;
        bottom: -14px;
        width: 84px;
        height: auto;
        pointer-events: none;
      }

      .bottom {
        position: relative;
        z-index: 1;
        height: 100%;
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 22px 112px 10px 22px;
        direction: ltr;
      }

      .employee-number,
      .employee-id {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        min-width: 0;
      }

      .employee-number {
        align-items: flex-start;
        text-align: right;
        direction: rtl;
      }

      .employee-label-ar {
        font-size: 12px;
        font-weight: 600;
        line-height: 1.5;
        white-space: nowrap;
      }

      .employee-label-en {
        margin-top: 1px;
        color: rgba(255, 255, 255, 0.82);
        font-family: Inter, Arial, sans-serif;
        font-size: 10px;
        font-weight: 400;
        direction: ltr;
      }

      .number-separator {
        position: relative;
        z-index: 1;
        width: 1px;
        height: 38px;
        background: rgba(255, 255, 255, 0.72);
      }

      .employee-id {
        align-items: flex-start;
        justify-self: stretch;
      }

      .number {
        position: relative;
        z-index: 1;
        color: #fff;
        font-family: Inter, Arial, sans-serif;
        font-size: clamp(20px, 5.5vw, 23px);
        font-weight: 700;
        letter-spacing: 0.06em;
        direction: ltr;
      }

      @media (max-width: 390px) {
        .display {
          width: min(100%, 340px);
        }

        .badge-back {
          padding: 15px 18px 17px;
        }

        .brand {
          width: 100%;
          height: 108px;
          flex-basis: 108px;
        }

        .back-brand {
          height: 96px;
          flex-basis: 96px;
        }

        .insert {
          padding-inline: 12px;
        }

        .qr-wrap {
          width: 146px;
          height: 146px;
          margin-top: 16px;
        }

        .company-qr {
          width: 124px;
          height: 124px;
        }

        .footer {
          width: calc(100% + 24px);
          flex-basis: 116px;
          margin-inline: -12px;
        }

        .footer-wave {
          height: 158px;
        }

        .bottom {
          gap: 12px;
          padding: 18px 100px 8px 16px;
        }

        .footer-leaf {
          right: 12px;
          bottom: 8px;
          width: 74px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .card,
        .flip-control {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="display" aria-label="بطاقة تعريف موظف شركة فلدلفيا الزراعية">
      <div class="stage">
        <div
          class="card"
          id="employeeCard"
          role="button"
          tabindex="0"
          aria-label="اقلب البطاقة لعرض الظهر"
          aria-pressed="false"
        >
          <article class="badge badge-front" aria-label="وجه البطاقة">
            <div class="insert">
              <img
                class="brand"
                src="ph-agri-logo.png"
                alt="شعار فلدلفيا الزراعية PH. Agri"
              />
              <div class="brand-divider" aria-hidden="true"></div>

              <div class="portrait">
                <img src="ahmed-amer.jpg?v=2" alt="أحمد عامر" />
              </div>

              <div class="employee">
                <div class="employee-en" lang="en">Ahmed Amer</div>
              </div>

              <div class="divider" aria-hidden="true"></div>

              <div class="job">
                <div class="job-en" lang="en">Software Developer</div>
              </div>

              <div class="footer">
                <svg
                  class="footer-wave"
                  viewBox="0 0 360 176"
                  preserveAspectRatio="none"
                  aria-hidden="true"
                >
                  <defs>
                    <linearGradient id="waveBand" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stop-color="#f2c85a" />
                      <stop offset="42%" stop-color="#8d7340" />
                      <stop offset="100%" stop-color="#05391f" />
                    </linearGradient>
                  </defs>
                  <path
                    fill="#05391f"
                    d="M0 62C48 54 96 66 142 86C176 102 204 96 246 70C286 46 324 28 360 18V176H0Z"
                  />
                  <path
                    fill="url(#waveBand)"
                    d="M0 42C46 34 94 44 138 64C172 80 198 76 242 50C284 26 322 10 360 2V18C324 28 286 46 246 70C204 96 176 102 142 86C96 66 48 54 0 62Z"
                  />
                  <path
                    fill="none"
                    stroke="#f0c24a"
                    stroke-width="2.4"
                    stroke-linecap="round"
                    vector-effect="non-scaling-stroke"
                    d="M0 42C46 34 94 44 138 64C172 80 198 76 242 50C284 26 322 10 360 2"
                  />
                </svg>
                <img class="footer-leaf" src="leaf-mark.png?v=6" alt="" />
                <div class="bottom">
                  <div class="employee-number">
                    <div class="employee-label-ar" lang="ar">رقم الموظف</div>
                    <div class="employee-label-en" lang="en">Emp. No.</div>
                  </div>
                  <div class="number-separator" aria-hidden="true"></div>
                  <div class="employee-id">
                    <div class="number">12345</div>
                  </div>
                </div>
              </div>
            </div>
          </article>

          <article class="badge badge-back" aria-label="ظهر البطاقة">
            <img
              class="back-brand"
              src="ph-agri-logo.png"
              alt="شعار فلدلفيا الزراعية PH. Agri"
            />
            <div class="back-divider" aria-hidden="true"></div>
            <div class="back-title" lang="ar">تواصل مع شركتنا</div>
            <div class="back-subtitle" lang="en">CONNECT WITH OUR COMPANY</div>
            <div class="qr-wrap">
              <img
                class="company-qr"
                src="company-qr.png"
                alt="رمز QR لزيارة صفحات الشركة الرسمية"
                width="136"
                height="136"
              />
            </div>
            <div class="scan-label" lang="ar">
              امسح الرمز لزيارة صفحاتنا الرسمية
            </div>
            <div class="scan-hint" lang="en">
              SCAN TO VISIT OUR OFFICIAL PAGES
            </div>

            <div class="back-bottom">
              <div>
                <div class="back-company" lang="ar">فلدلفيا الزراعية</div>
                <div class="back-company-en" lang="en">
                  PHELADELFIA AGRICULTURAL LLC
                </div>
              </div>
            </div>
          </article>
        </div>
      </div>

      <button class="flip-control" id="flipControl" type="button">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M20 7v5h-5M4 17v-5h5" />
          <path
            d="M5.5 9a7 7 0 0 1 11.6-2.2L20 12M4 12l2.9 5.2A7 7 0 0 0 18.5 15"
          />
        </svg>
        <span>اعرض ظهر البطاقة</span>
      </button>
    </main>
    <script>
      const card = document.getElementById("employeeCard");
      const flipControl = document.getElementById("flipControl");
      const flipLabel = flipControl.querySelector("span");

      function flipCard() {
        const flipped = card.classList.toggle("flipped");
        card.setAttribute("aria-pressed", String(flipped));
        card.setAttribute(
          "aria-label",
          flipped ? "اقلب البطاقة لعرض الوجه" : "اقلب البطاقة لعرض الظهر",
        );
        flipLabel.textContent = flipped
          ? "اعرض وجه البطاقة"
          : "اعرض ظهر البطاقة";
      }

      card.addEventListener("click", flipCard);
      card.addEventListener("keydown", (event) => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          flipCard();
        }
      });
      flipControl.addEventListener("click", flipCard);
    </script>
  </body>
</html>
